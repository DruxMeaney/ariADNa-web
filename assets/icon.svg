<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Doble helice de ADN">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102033"/>
      <stop offset="1" stop-color="#071522"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="none" stroke="#39FF14" stroke-width="0.85" opacity="0.28"/>

  <g filter="url(#softGlow)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#7FFFA3" stroke-width="2.15" opacity="0.9">
      <line x1="24.5" y1="15.6" x2="39.5" y2="20.4"/>
      <line x1="22.9" y1="22.8" x2="41.1" y2="28.0"/>
      <line x1="23.3" y1="31.0" x2="40.7" y2="31.0"/>
      <line x1="22.9" y1="39.2" x2="41.1" y2="34.0"/>
      <line x1="24.5" y1="46.4" x2="39.5" y2="41.6"/>
    </g>

    <path
      d="M32 9.5 C45.2 15.2 45.2 24.8 32 30.5 C18.8 36.2 18.8 45.8 32 51.5"
      fill="none"
      stroke="#F4FFF8"
      stroke-width="4.2"
    />
    <path
      d="M32 9.5 C18.8 15.2 18.8 24.8 32 30.5 C45.2 36.2 45.2 45.8 32 51.5"
      fill="none"
      stroke="#39FF14"
      stroke-width="4.2"
    />
